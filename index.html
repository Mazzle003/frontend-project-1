<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Montserrat Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Fraunces Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="/style.css" rel="stylesheet" />

    <title>Product preview card component</title>
</head>
<body>
    <div class="container">
        <div class="image-box">
            <img class="product_image-desktop" src="/assets/images/image-product-desktop.jpg" role="img"
                aria-label="perfume-display" />
            <img class="product_image-mobile" src="/assets/images/image-product-mobile.jpg" role="img"
                aria-label="perfume-display" />
        </div>

        <div class="product_details">
            <h1 class="perfume">Perfume</h1>
            <h2 class="perfume-name">Gabrielle Essence Eau De Parfum</h2>
            <p class="perfume-description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
                Perfumer-Creator for the House of CHANEL.</p>
            <div class="prices">
                <span class="main-price">$149.99</span>
                <span class="slashed-price">$169.99</span>
            </div>
            <div class="cta">
                <img src="./assets/images/icon-cart.svg" alt="shopping-icon" class="cta-icon">
                <span class="cta-text">Add to Cart</span>
            </div>
        </div>
    </div>
</body>
</html>
